name: Update Go version

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: oldstable
      - run: |
          version=$(go env GOVERSION | sed -E 's/^go([0-9]+\.[0-9]+).*/\1/')
          go mod edit -go="$version"
          branch="update-go-$version"
          git diff --quiet && exit 0
          git ls-remote --exit-code --heads origin "$branch" && exit 0

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "Update Go to $version"
          git push origin "$branch"
          gh pr create --fill
          # PRs opened with GITHUB_TOKEN do not trigger pull_request workflows.
          gh workflow run ci.yml --ref "$branch"
